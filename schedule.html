<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule — re:Invent 2026</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="schedule.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>My Schedule</h1>
      <nav class="page-nav">
        <a href="index.html">Catalog</a>
      </nav>
    </div>
  </header>

  <main>
    <p id="empty-schedule-message" hidden>
      You haven't added any sessions yet. Go to the
      <a href="index.html">Catalog</a> and click "Add" on sessions you want to attend.
    </p>

    <div id="calendar" class="calendar"></div>

    <section id="unscheduled-section" class="unscheduled-section" hidden>
      <h2>Sessions without an assigned day/time</h2>
      <ul id="unscheduled-list" class="unscheduled-list"></ul>
    </section>
  </main>

  <div id="session-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="schedule-page.js"></script>
</body>
</html>
